services:
  # ── PostgreSQL + pgvector ────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: marqueteiro_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: meu_marqueteiro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meu_marqueteiro"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - marqueteiro

volumes:
  postgres_data:

networks:
  marqueteiro:
    driver: bridge
